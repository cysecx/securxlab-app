plugins { id 'com.android.application' }
android {
    namespace 'com.securxlab.app'
    compileSdk 34
    defaultConfig {
        applicationId 'com.securxlab.app'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
        buildConfigField 'String', 'DASH_URL', '"' + (project.findProperty('DASH_URL') ?: 'https://dash.securxlab.com') + '"'
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
}
